<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Focus Music Mixer — YouTube embed proxy</title>
  <!--
    This page exists only to be iframed by the Focus Music Mixer Figma
    plugin's ui.html. It must be hosted on a real, non-sandboxed domain
    (e.g. GitHub Pages) — embedding youtube-nocookie.com directly from
    inside Figma's sandboxed plugin UI iframe triggers YouTube error 153
    ("Video player configuration error"), because that UI has no stable
    origin to present as a referrer. This page does, so it can embed
    YouTube on the plugin's behalf.

    This page DOES use the YouTube IFrame Player API (enablejsapi) —
    unlike the plugin's own ui.html, this page has a real, stable origin
    (this GitHub Pages domain), so YouTube's origin/referrer check passes
    here even though it fails inside Figma's sandboxed plugin UI. That
    lets us relay real play/pause/state control to the parent (ui.html)
    via postMessage, instead of only offering YouTube's on-screen controls.
  -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; width: 100vw; height: 100vh; overflow: hidden; }
    #player { width: 100%; height: 100%; }
    #player iframe { width: 100%; height: 100%; border: none; display: block; }
    #error { color: #fff; font-family: sans-serif; padding: 20px; display: none; }
  </style>
</head>
<body>
  <div id="error">No video ID or playlist ID provided.</div>
  <div id="player"></div>
  <script>
    var params = new URLSearchParams(location.search);
    var v = params.get("v");
    var list = params.get("list");
    var start = params.get("start") || params.get("t") || "";
    var autoplay = params.get("autoplay") === "1";

    var player = null;
    var playerReady = false;
    // Commands that arrive from the parent before the player is ready are
    // queued and flushed once onReady fires, so a fast "play" right after
    // loading a link isn't silently dropped.
    var pendingCommands = [];

    function postToParent(msg) {
      parent.postMessage(msg, "*");
    }

    function applyCommand(cmd) {
      if (!player) return;
      if (cmd.action === "play") player.playVideo();
      else if (cmd.action === "pause") player.pauseVideo();
      else if (cmd.action === "setVolume" && typeof cmd.value === "number") player.setVolume(cmd.value);
    }

    window.addEventListener("message", function (event) {
      var msg = event.data;
      if (!msg || msg.type !== "yt-command") return;
      if (playerReady) applyCommand(msg);
      else pendingCommands.push(msg);
    });

    function onYouTubeIframeAPIReady() {
      var playerVars = { playsinline: 1, autoplay: autoplay ? 1 : 0 };
      if (start) playerVars.start = Number(start);
      var opts = {
        host: "https://www.youtube-nocookie.com",
        playerVars: playerVars,
        events: {
          onReady: function () {
            playerReady = true;
            postToParent({ type: "yt-ready" });
            pendingCommands.forEach(applyCommand);
            pendingCommands = [];
          },
          onStateChange: function (e) {
            if (e.data === YT.PlayerState.PLAYING) postToParent({ type: "yt-state", playing: true });
            else if (e.data === YT.PlayerState.PAUSED) postToParent({ type: "yt-state", playing: false });
          },
          onError: function (e) {
            postToParent({ type: "yt-error", code: e.data });
          }
        }
      };
      if (list && !v) {
        playerVars.listType = "playlist";
        playerVars.list = list;
      } else {
        opts.videoId = v;
        if (list) playerVars.list = list;
      }
      player = new YT.Player("player", opts);
    }

    if (!v && !list) {
      document.getElementById("error").style.display = "block";
    } else {
      window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;
      var s = document.createElement("script");
      s.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(s);
    }
  </script>
</body>
</html>
